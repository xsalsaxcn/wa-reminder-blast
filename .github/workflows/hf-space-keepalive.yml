name: HF Space Keepalive

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notiva-hf-space-keepalive
  cancel-in-progress: true

env:
  HF_SPACE_URL: https://ai-think-wa-reminder-blast-runner.hf.space/

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Keep Hugging Face Space warm
        shell: bash
        run: |
          set -u

          success=0

          for attempt in 1 2 3 4; do
            echo "HF keepalive attempt ${attempt}/4"

            http_code="$(
              curl -L                 --silent                 --show-error                 --output /tmp/hf-keepalive-body.txt                 --write-out "%{http_code}"                 --connect-timeout 15                 --max-time 75                 -H "Accept: application/json,text/plain,*/*"                 -H "Cache-Control: no-cache"                 -H "User-Agent: Notiva-HF-Keepalive/2.0"                 "${HF_SPACE_URL}?keepalive=$(date +%s)"                 || true
            )"

            echo "HTTP ${http_code:-000}"

            if [[ "${http_code:-000}" =~ ^2[0-9][0-9]$ ]] ||                [[ "${http_code:-000}" =~ ^3[0-9][0-9]$ ]]; then
              success=1
              break
            fi

            sleep 15
          done

          echo "---- HF response preview ----"
          head -c 1200 /tmp/hf-keepalive-body.txt 2>/dev/null || true
          echo
          echo "-----------------------------"

          if [ "${success}" -ne 1 ]; then
            echo "HF Space did not become healthy during this keepalive run."
            exit 1
          fi
