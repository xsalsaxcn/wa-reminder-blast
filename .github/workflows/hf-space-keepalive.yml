name: HF Space Keepalive

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notiva-hf-space-keepalive
  cancel-in-progress: true

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Keep Notiva HF worker warm through production status endpoint
        shell: bash
        run: |
          set -u

          STATUS_URL="https://wa-reminder-blast.vercel.app/api/hf-worker/status"
          success=0

          for attempt in 1 2 3 4; do
            echo "Keepalive attempt ${attempt}/4"

            response="$(
              curl --fail --silent --show-error --location --connect-timeout 15 --max-time 45 -H "Accept: application/json" -H "Cache-Control: no-cache" -H "User-Agent: Notiva-HF-Keepalive/3.0" "${STATUS_URL}?keepalive=$(date +%s)" 2>&1
            )"
            exit_code=$?

            echo "${response}"

            if [ "${exit_code}" -eq 0 ]; then
              success=1
              break
            fi

            echo "Attempt ${attempt} failed; retrying after 15 seconds."
            sleep 15
          done

          if [ "${success}" -ne 1 ]; then
            echo "HF keepalive failed after all attempts."
            exit 1
          fi

          echo "HF keepalive succeeded."
