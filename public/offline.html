<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Notiva Offline</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f1f5f9;
        color: #0f172a;
        display: grid;
        min-height: 100vh;
        place-items: center;
      }
      .card {
        max-width: 420px;
        border-radius: 24px;
        background: white;
        padding: 28px;
        box-shadow: 0 12px 40px rgba(15, 23, 42, .12);
      }
      h1 { margin: 0 0 8px; font-size: 24px; }
      p { margin: 0; color: #64748b; line-height: 1.6; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Notiva sedang offline</h1>
      <p>Koneksi internet tidak tersedia. Hubungkan perangkat ke internet lalu buka kembali Notiva.</p>
    </div>
  </body>
</html>
